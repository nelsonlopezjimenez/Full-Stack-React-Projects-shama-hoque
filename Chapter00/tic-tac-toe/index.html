<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
  </head>
  <body>
    <!-- React puts the whole app inside this empty div (see src/main.jsx). -->
    <div id="root"></div>
    <!-- type="module": the browser loads main.jsx as an ES module. Vite turns the JSX into
         plain JavaScript before the browser sees it. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
